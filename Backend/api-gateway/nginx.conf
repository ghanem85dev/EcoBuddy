events {}
http {
    upstream energy {
        server energy-service:8000;
    }
    upstream chatbot {
        server chatbot-service:5005;
    }
   

    server {
        listen 80;

        # Energy Service
        location /api/v1/energy/ {
            proxy_pass http://energy/;
            proxy_set_header X-User-ID $http_x_user_id;
        }

        # Chatbot Service
        location /api/v1/chatbot/ {
            proxy_pass http://chatbot/;
        }

    
    }
}